name: Deploy landing page to GitHub Pages

# 介绍页在 docs/index.html（自包含单文件，图片用 docs/screenshots/ 里的演示截图）。
# 发布方式二选一：
#   A. 本工作流（推荐）：仓库 Settings → Pages → Source 选「GitHub Actions」，push 到 main 即自动发布；
#   B. 不用 Actions：Settings → Pages → Source 选「Deploy from a branch」，分支 main / 目录 /docs。
on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
