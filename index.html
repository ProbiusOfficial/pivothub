    </div>

    <div class="db-layout">
      <div class="panel db-col">
        <div class="panel-head">
          <h3>连接</h3>
          <span class="muted tiny">{{ conns.length }} 个</span>
        </div>
        <p class="muted tiny" v-if="!conns.length">还没有数据库连接，点右上角「＋ 新建连接」。</p>
        <div class="list-row" v-for="c in conns" :key="c.id" :class="{ 'is-active': c.id === activeId }" @click="pick(c)">
          <span class="dot" :class="c.id === activeId ? 'is-on' : 'is-off'"></span>
          <span class="grow">
            <b>{{ c.name }}</b>
            <span class="muted tiny mono"> {{ kindLabel(c.kind) }} · {{ c.host }}:{{ c.port || c.defaultPort }}</span>
            <span class="muted tiny" v-if="c.shellId"> · 经会话</span>
          </span>
          <button class="btn btn-xs" @click.stop="test(c)">测试</button>
          <button class="btn btn-xs btn-danger" @click.stop="remove(c)">删除</button>
        </div>
      </div>

      <!-- ② 结构树：选中连接即自动探测（库 → 表 → 列） -->
      <div class="panel db-col db-tree">
        <div class="panel-head">
          <h3>结构</h3>
          <span class="row-gap">
            <span class="muted tiny" v-if="schemaMs">{{ tableCount }} 表 · {{ schemaMs }}ms</span>
            <button class="btn btn-xs" :disabled="!active || schemaBusy" @click="loadSchema">{{ schemaBusy ? '探测中…' : '刷新' }}</button>
          </span>
        </div>
        <p class="muted tiny" v-if="!active">先选择一个连接</p>
        <p class="muted tiny" v-else-if="schemaBusy">正在探测库 / 表 / 列结构…</p>
        <p class="muted tiny" v-else-if="schemaError">探测失败：{{ schemaError }}</p>
        <div v-for="db in schema" :key="db.name" class="tree-db">
          <div class="tree-row" @click="toggleDb(db.name)">
            <svg class="ico" viewBox="0 0 24 24" v-html="icon('database')"></svg>
            <span class="grow mono">{{ db.name }}</span>
            <span class="badge badge-idle">{{ db.tables.length }} 表</span>
          </div>
          <template v-if="expandedDbs[db.name]">
            <div v-for="t in db.tables" :key="t.name">
              <div class="tree-row tree-table"
                   :class="{ 'is-active': activeTable === db.name + '.' + t.name }"
                   @click="openTable(db.name, t)">
                <svg class="ico" viewBox="0 0 24 24" v-html="icon('server')"></svg>
                <span class="grow mono">{{ t.name }}</span>
                <span class="badge badge-idle" v-if="t.rows">{{ t.rows }} 行</span>
                <span class="badge badge-idle" v-else>{{ t.columns.length }} 列</span>
              </div>
              <div v-if="expandedTables[db.name + '.' + t.name]" class="tree-cols">
                <div class="tree-col" v-for="c in t.columns" :key="c.name">
                  <span class="grow mono">{{ c.name }}</span>
                  <span class="muted tiny mono">{{ c.type }}</span>
                  <span class="badge badge-warn" v-if="c.key === 'PRI'">PK</span>
                  <span class="badge badge-idle" v-if="!c.nullable">NN</span>
                </div>
                <p class="muted tiny" v-if="!t.columns.length">（无列信息）</p>
              </div>
            </div>
          </template>
        </div>
        <p class="muted tiny" v-if="active && !schemaBusy && !schemaError && !schema.length">未探测到表结构</p>
      </div>

      <!-- ③ 查询与结果 -->
      <div class="db-main">
        <div class="panel" v-if="showForm" style="margin-bottom:12px">
          <div class="panel-head"><h3>新建数据库连接</h3></div>
          <div class="form-row">
            <label class="field"><span>名称</span><input class="input" v-model="form.name" placeholder="如 靶机 MySQL" /></label>
            <label class="field">
              <span>类型</span>
              <select class="input" v-model="form.kind">
                <option v-for="k in kinds" :key="k" :value="k">{{ kindLabel(k) }}</option>
              </select>
            </label>
          </div>
          <div class="form-row">
            <label class="field"><span>主机 / SQLite 文件路径</span><input class="input mono" v-model="form.host" /></label>
            <label class="field"><span>端口（0 = 默认）</span><input class="input mono" type="number" v-model.number="form.port" /></label>
          </div>
          <div class="form-row">
            <label class="field"><span>用户名</span><input class="input mono" v-model="form.username" /></label>
            <label class="field"><span>密码</span><input class="input mono" type="password" v-model="form.password" /></label>
          </div>
          <div class="form-row">
            <label class="field"><span>库名（PostgreSQL 用）</span><input class="input mono" v-model="form.dbName" /></label>
            <label class="field">
              <span>经哪个会话执行</span>
              <select class="input" v-model="form.shellId">
                <option value="">本机执行（SQLite 可用）</option>
                <option v-for="s in shells" :key="s.id" :value="s.id">{{ s.hostname || s.url }}</option>
              </select>
            </label>
          </div>
          <label class="field field-full"><span>备注</span><input class="input" v-model="form.note" /></label>
          <div class="row-gap" style="margin-top:8px">
            <button class="btn btn-primary" :disabled="busy" @click="save">保存</button>
            <button class="btn" @click="showForm = false">取消</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>
              {{ active ? active.name : '选择左侧连接' }}
              <span class="muted tiny" v-if="activeTable"> · {{ activeTable }}</span>
            </h3>
            <div class="row-gap">
              <button class="btn btn-xs" :disabled="!active" @click="quick('SELECT 1')">SELECT 1</button>
              <button class="btn btn-xs" :disabled="!active" @click="listTables">库 / 表列表</button>
            </div>
          </div>
          <textarea class="input mono textarea-lg" v-model="sql" placeholder="输入 SQL（如 SELECT * FROM users LIMIT 20）"></textarea>
          <div class="row-gap" style="margin-top:8px">
            <button class="btn btn-primary" :disabled="busy || !active" @click="run()">{{ busy ? '执行中…' : '执行' }}</button>
            <span class="muted tiny" v-if="result && result.ms">耗时 {{ result.ms }}ms</span>
            <span class="muted tiny mono" v-if="result && result.cmd" :title="result.cmd">{{ result.cmd.slice(0, 90) }}</span>
          </div>

          <div class="callout" v-if="testOut">
            <b>{{ testOut.ok ? '✓ 连接成功' : '✗ 连接失败' }}</b>
            <p class="muted tiny mono">{{ testOut.error || ((testOut.columns || []).join(' | ') + ' ' + ((testOut.rows || [])[0] || []).join(' | ')) }}</p>
          </div>
          <div class="callout" v-if="result && result.error" style="border-color: rgba(255, 77, 94, 0.4)">
            <b>执行失败</b>
            <p class="muted tiny mono">{{ result.error }}</p>
          </div>

          <table class="table" v-if="result && result.ok && result.columns.length">
            <thead><tr><th v-for="c in result.columns" :key="c">{{ c }}</th></tr></thead>
            <tbody>
              <tr v-for="(row, i) in result.rows.slice(0, 500)" :key="i">
                <td v-for="(v, j) in row" :key="j" class="mono">{{ v }}</td>
              </tr>
            </tbody>
          </table>
          <p class="muted tiny" v-if="result && result.ok && result.rows.length > 500">仅显示前 500 行（共 {{ result.rows.length }} 行）</p>
          <p class="muted tiny" v-if="result && result.ok && !result.rows.length">查询成功，无数据行。</p>
        </div>
      </div>
    </div>
  </div>
</script>

<!-- ============================= 模板：插件市场 ============================= -->
<script type="text/x-template" id="tpl-plugins">
  <div class="view view-plugins">
    <div class="view-head">
      <div>
        <h2>插件市场</h2>
        <p class="muted">数据插件（命令库 / 马模板 / 固化技法 / 提权规则）：安装后立即并入对应视图，停用即撤下</p>
      </div>
      <div class="view-head-actions">
        <select class="input input-sm" v-model="filter" style="width:160px">
          <option value="all">全部插件</option>
          <option value="installed">已安装（{{ installedCount }}）</option>
          <option value="commands">命令库</option>
          <option value="privesc">提权规则</option>
          <option value="tty_fixes">固化技法</option>
          <option value="payloads">马模板</option>
        </select>
        <button class="btn btn-sm" @click="load">刷新</button>
      </div>
    </div>

    <p class="muted tiny">
      清单来源：<span class="mono">{{ source || '(未配置)' }}</span>
      <span class="badge badge-warn" v-if="remoteError">远程清单不可达，已回落本地</span>
    </p>

    <div class="plugin-grid">
      <div class="panel" v-for="p in filtered" :key="p.id">
        <div class="panel-head">
          <h3>{{ p.name }}</h3>
          <span class="badge badge-info">{{ typeLabel(p.type) }}</span>
        </div>
        <p class="muted tiny">{{ p.description || '（无描述）' }}</p>
        <div class="row-gap" style="margin:6px 0">
          <span class="badge badge-idle" v-if="p.version">v{{ p.version }}</span>
          <span class="badge badge-idle" v-if="p.author">{{ p.author }}</span>
          <span class="badge badge-idle" v-if="p.fileCount">{{ p.fileCount }} 个文件</span>
          <span class="badge" :class="p.installed ? (p.enabled ? 'badge-ok' : 'badge-warn') : 'badge-idle'">
            {{ p.installed ? (p.enabled ? '已启用' : '已停用') : '未安装' }}
          </span>
        </div>
        <div class="row-gap">
          <button class="btn btn-sm btn-primary" v-if="!p.installed && p.installable"
                  :disabled="busyId === p.id" @click="install(p)">{{ busyId === p.id ? '安装中…' : '安装' }}</button>
          <button class="btn btn-sm" v-if="p.installed" :disabled="busyId === p.id" @click="toggle(p)">
            {{ p.enabled ? '停用' : '启用' }}
          </button>
          <button class="btn btn-sm btn-danger" v-if="p.installed" :disabled="busyId === p.id" @click="uninstall(p)">卸载</button>
          <span class="muted tiny" v-if="!p.installable && !p.installed">该清单项未内联内容，需手工安装</span>
        </div>
      </div>
    </div>
    <p class="muted tiny" v-if="!filtered.length">没有匹配的插件。</p>
  </div>
</script>

<!-- ============================= 模板：导出 ============================= -->
<script type="text/x-template" id="tpl-export">
  <div class="view view-export">
    <div class="view-head">
      <div>
        <h2>复盘与导出</h2>
        <p class="muted">以时间线为骨架 + 拓扑图快照 + 笔记，生成 Markdown Writeup 初稿 / HTML 交互报告 / JSON 原始数据</p>
      </div>
      <div class="view-head-actions">
        <div class="seg">
          <button v-for="f in formats" :key="f.key" class="seg-btn" :class="{ 'is-active': fmt === f.key }" @click="fmt = f.key">{{ f.label }}</button>
        </div>
        <button class="btn btn-sm" @click="copy(preview)">复制</button>
        <button class="btn btn-sm btn-primary" @click="download()">导出下载</button>
      </div>
    </div>

    <div class="export-grid">
      <div class="panel">
        <div class="panel-head"><h3>导出选项</h3></div>
        <div class="form-stack">
          <label class="field checkbox-line"><input type="checkbox" v-model="opt.topo" /><span>包含拓扑图快照（SVG / 内嵌图）</span></label>
          <label class="field checkbox-line"><input type="checkbox" v-model="opt.timeline" /><span>包含完整操作时间线</span></label>
          <label class="field checkbox-line"><input type="checkbox" v-model="opt.creds" /><span>包含凭据列表（明文）</span></label>
          <label class="field checkbox-line"><input type="checkbox" v-model="opt.flags" /><span>包含 Flag 收集表</span></label>
          <label class="field checkbox-line"><input type="checkbox" v-model="opt.placeholder" /><span>插入截图占位符</span></label>
          <label class="field checkbox-line"><input type="checkbox" v-model="opt.chain" /><span>包含跳板链参数与命令回放</span></label>
          <div class="callout">
            <b>项目打包</b>
            <p class="muted tiny">支持将项目 + 截图附件打包为 .zip，便于换机或分享复盘（M6-3）。</p>
            <button class="btn btn-sm btn-block" @click="toast('已生成 pivothub-project.zip', 'ok')">打包项目</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h3>预览 · {{ currentFormat.label }}</h3>
          <span class="badge badge-info mono">{{ sizeText }}</span>
        </div>
        <pre class="code-block code-tall">{{ preview }}</pre>
      </div>
    </div>
  </div>
</script>

<!-- ============================= 模板：看板 ============================= -->
<script type="text/x-template" id="tpl-dashboard">
  <div class="view view-dashboard">
    <div class="view-head">
      <div>
        <h2>阶段看板</h2>
        <p class="muted">{{ project.name }} · 已控主机 / 层级深度 / Flag 进度 / 剩余时间</p>
      </div>
      <div class="view-head-actions">
        <button class="btn btn-sm" @click="goto('topology')">打开拓扑</button>
        <button class="btn btn-sm btn-primary" @click="goto('export')">导出 Writeup</button>
      </div>
    </div>

    <div class="dash-metrics">
      <div class="metric-card">
        <span class="metric-k">已控主机</span>
        <b class="metric-v mono">{{ stats.ownedHosts }}<small>/ {{ stats.hosts }}</small></b>
        <div class="progress"><i :style="{ width: pct(stats.ownedHosts, stats.hosts) }"></i></div>
      </div>
      <div class="metric-card">
        <span class="metric-k">层级深度</span>
        <b class="metric-v mono">{{ stats.maxLayer }}</b>
        <div class="metric-sub muted">L1 → L{{ stats.maxLayer }}，共 {{ stats.segments }} 个网段</div>
      </div>
      <div class="metric-card">
        <span class="metric-k">Flag 进度</span>
        <b class="metric-v mono text-ok">{{ stats.flags }}<small>/ {{ stats.flagsTotal }}</small></b>
        <div class="progress"><i :style="{ width: pct(stats.flags, stats.flagsTotal) }"></i></div>
      </div>
      <div class="metric-card">
        <span class="metric-k">剩余时间</span>
        <b class="metric-v mono" :class="timer.remainSec < 1800 ? 'text-warn' : ''">{{ remainText }}</b>
        <div class="progress"><i :style="{ width: timerPct + '%' }"></i></div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <div class="panel-head"><h3>攻击路径 · 跳板链</h3><span class="muted tiny">自动按链路推导</span></div>
        <div class="chain-flow">
          <div class="chain-node is-attacker">
            <b>攻击端</b><small>127.0.0.1</small>
          </div>
          <div class="chain-arrow" v-for="(n, i) in chainNodes" :key="n.id">
            <div class="arrow-line">
              <span class="arrow-label mono">{{ n.link ? n.link.tool + ' · ' + (n.link.localSocks || '') : '' }}</span>
            </div>
            <div class="chain-node" :class="{ 'is-owned': n.owned }">
              <b class="mono">{{ n.ip }}</b>
              <small>{{ n.hostname || n.os }}</small>
              <span class="badge badge-info">{{ n.layer }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>阶段进度</h3></div>
        <div class="stage-list">
          <div class="stage-item" v-for="s in stageProgress" :key="s.name">
            <div class="stage-row">
              <span>{{ s.name }}</span>
              <span class="mono muted">{{ s.done }}/{{ s.total }}</span>
            </div>
            <div class="progress"><i :style="{ width: pct(s.done, s.total) }" :class="s.done === s.total ? 'is-done' : ''"></i></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>最近事件</h3><button class="btn btn-xs btn-ghost" @click="goto('timeline')">全部</button></div>
        <div class="list-row" v-for="e in recent" :key="e.id">
          <span class="mono muted">{{ e.time }}</span>
          <span class="badge" :class="'badge-' + kindBadge(e.kind)">{{ kindLabel(e.kind) }}</span>
          <span class="grow ellipsis">{{ e.title }}</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>链路健康</h3><button class="btn btn-xs btn-ghost" @click="goto('proxy')">编排台</button></div>
        <div class="list-row" v-for="l in links" :key="l.id">
          <span class="dot" :class="l.status === 'alive' ? 'is-on' : l.status === 'error' ? 'is-err' : 'is-off'"></span>
          <span class="mono grow">{{ l.tool }} · {{ ipOf(l.fromHostId) }} → {{ l.targetSegment }}</span>
          <span class="mono muted">{{ l.status === 'alive' ? l.latency + 'ms' : '断开' }}</span>
        </div>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="tpl-toast">
  <div class="toast-stack">
    <transition-group name="toast">
      <div class="toast" v-for="t in toasts" :key="t.id" :class="'toast-' + t.kind">
        <svg class="ico" viewBox="0 0 24 24" v-html="icon(t.kind === 'ok' ? 'check' : t.kind === 'err' ? 'shield' : 'activity')"></svg>
        <span>{{ t.msg }}</span>
      </div>
    </transition-group>
  </div>
</script>

<script type="text/x-template" id="tpl-modal-layer">
  <div class="modal-mask" v-if="ui.modal && !['shell-add','host-add','scan-import','cred-add','flag-add','note-add','tty-fix','attack-cfg','tools-cfg','global-cfg','probe'].includes(ui.modal)" @click.self="ui.modal = null">
    <div class="modal">
      <div class="modal-head">
        <h3>{{ modalTitle }}</h3>
        <button class="icon-btn" @click="ui.modal = null">×</button>
      </div>
      <div class="modal-body">
        <pre class="code-block code-tall" v-if="modalCode">{{ modalCode }}</pre>
        <div v-else-if="ui.modalData && ui.modalData.html" v-html="ui.modalData.html"></div>
        <p v-else class="muted">（暂无内容）</p>
      </div>
      <div class="modal-foot">
        <button class="btn" @click="ui.modal = null">关闭</button>
        <button class="btn btn-primary" v-if="modalCode" @click="copy(modalCode)">复制内容</button>
      </div>
    </div>
  </div>
</script>
